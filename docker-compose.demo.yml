# demo.umbraculum.dev — slim production stack (Traefik edge + internal nginx).
# Requires UMBRACULUM_DEV_ROOT (default /opt/umbraculum-dev) and a prior:
#   ./scripts/build-packages-in-docker.sh --all --fresh
# (populates umbraculum_root_node_modules + package dist/). See docs/OPERATOR.md
name: umbraculum-demo

services:
  traefik:
    # v3.3 Docker provider speaks API 1.24; Docker CE 29+ (bin/bootstrap) requires >= 1.44.
    # Use v3.6+ for API negotiation — otherwise no container routes and LE never issues.
    # Digest pin locks the edge against silent upstream updates. To bump:
    #   docker pull traefik:v3.6 && docker inspect traefik:v3.6 --format '{{index .RepoDigests 0}}'
    image: traefik:v3.6@sha256:802adc80a7bb20a6766c9385c2ad547f0de98564cd20d31d0b6d8f726f906f66
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - demo

  nginx:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - demo
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo-http.rule=Host(`demo.umbraculum.dev`)
      - traefik.http.routers.demo-http.entrypoints=web
      - traefik.http.routers.demo-http.middlewares=demo-redirect
      - traefik.http.middlewares.demo-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.demo-redirect.redirectscheme.permanent=true
      - traefik.http.routers.demo.rule=Host(`demo.umbraculum.dev`)
      - traefik.http.routers.demo.entrypoints=websecure
      - traefik.http.routers.demo.tls.certresolver=le
      - traefik.http.services.demo.loadbalancer.server.port=80

  api:
    image: node:20-slim
    restart: unless-stopped
    working_dir: /repo
    command:
      - sh
      - -c
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends openssl
        rm -rf /var/lib/apt/lists/*
        npm exec -w @umbraculum/api -- prisma generate --schema=/repo/services/api/prisma/schema.prisma
        npm run build -w @umbraculum/api
        exec npm run start -w @umbraculum/api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL}
      DATABASE_URL_RO: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      GOTENBERG_BASE_URL: http://gotenberg:3000
      RENDERING_SIGNING_SECRET: ${RENDERING_SIGNING_SECRET}
      APP_AI_KEY_SECRET: ${APP_AI_KEY_SECRET}
      UMBRACULUM_REPO_ROOT: /repo
      UMBRACULUM_MODULE_PROFILE: ${UMBRACULUM_MODULE_PROFILE:-reference}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      E2E_MEMBER_PASSWORD: ${E2E_MEMBER_PASSWORD:-}
      E2E_VIEWER_PASSWORD: ${E2E_VIEWER_PASSWORD:-}
    volumes:
      - ${UMBRACULUM_DEV_ROOT:-/opt/umbraculum-dev}:/repo
      - umbraculum_root_node_modules:/repo/node_modules
      - umbraculum_npm_cache:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
    networks:
      - demo

  web:
    image: node:20-slim
    restart: unless-stopped
    working_dir: /repo
    command:
      - sh
      - -c
      - |
        set -e
        npm run build -w @umbraculum/web
        exec npm run start -w @umbraculum/web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_WEB_SHARED_LAYOUT_NOTICE_ID: demo
      UMBRACULUM_MODULE_PROFILE: ${UMBRACULUM_MODULE_PROFILE:-reference}
    volumes:
      - ${UMBRACULUM_DEV_ROOT:-/opt/umbraculum-dev}:/repo
      - umbraculum_root_node_modules:/repo/node_modules
      - umbraculum_npm_cache:/root/.npm
    depends_on:
      - api
    networks:
      - demo

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brewapp
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      - ${UMBRACULUM_DEV_ROOT:-/opt/umbraculum-dev}/infra/postgres/init/03-ai-pgvector.sql:/docker-entrypoint-initdb.d/03-ai-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - demo_redisdata:/data
    networks:
      - demo

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - demo

networks:
  demo:
    name: umbraculum-demo

volumes:
  traefik_acme:
    name: umbraculum_demo_traefik_acme
  demo_pgdata:
    name: umbraculum_demo_pgdata
  demo_redisdata:
    name: umbraculum_demo_redisdata
  umbraculum_root_node_modules:
    name: umbraculum_root_node_modules
    external: true
  umbraculum_npm_cache:
    name: umbraculum_npm_cache
    external: true
